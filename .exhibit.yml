# Example config — copy to the root of the repo you want to verify.
# In this repo it also drives the self-test against examples/demo-app.
tracker: jira
ticket_pattern: "[A-Z][A-Z0-9]+-\\d+"
preview_url: "http://localhost:4173"
# language: auto               # auto = the ticket's language; or pl, Polish, de, Deutsch, …
# acceptance_headings: ["Akzeptanzkriterien"]   # your own heading for the criteria section of a ticket
model:
  provider: anthropic          # switches to openai automatically if only OPENAI_API_KEY is set
  max_cost_per_run_usd: 1.5
  # call_timeout_s: 180        # give up on a model call that gets no answer
  # effort:                   # reasoning per stage: low | medium | high
  #   review: medium
  #   plan: low
  #   agent: low
mode: comment
max_scenarios: 6
# scenario_timeout_s: 600      # stop a browser scenario that takes longer and report it as blocked
# Facts about the test environment that are not in the ticket (no real passwords here).
# The planner and the browser agent both read them.
agent_notes: |
  Registered test account: ana@example.com (no password needed for the reset flow).
  Any other address, e.g. nobody@example.com, is an unknown account.
